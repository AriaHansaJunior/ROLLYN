name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.3'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: |
        if [ -f .env ]; then
          echo ".env already exists"
        elif [ -f .env.example ]; then
          cp .env.example .env
        else
          echo "APP_ENV=testing" > .env
        fi
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: |
        # Generate an app key if missing and export it to subsequent steps
        if [ -f .env ] && grep -q '^APP_KEY=' .env; then
          echo ".env already contains APP_KEY"
        else
          php artisan key:generate --ansi
        fi
        if [ -f .env ]; then
          KEY=$(grep '^APP_KEY=' .env | sed 's/^APP_KEY=//') || true
          if [ -n "$KEY" ]; then
            echo "APP_KEY=$KEY" >> $GITHUB_ENV
          fi
        fi
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        APP_KEY: base64:ljaQ98xNsPQ1EP9AQXyBpvz6aHIuvDpOEsr3auHVbj8=
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
